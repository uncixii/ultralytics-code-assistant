[project]
name = "ultralytics-code-assistant"
version = "0.1.0"
description = "Source-grounded assistant for the Ultralytics YOLO codebase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.15,<5",
    "python-dotenv>=1.1,<2",
    "sentence-transformers>=3,<6",
    "streamlit>=1.40,<2",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
